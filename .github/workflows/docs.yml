# Publica a documentacao NUM OUTRO REPOSITORIO, publico, e gera o PDF no
# mesmo build.
#
# POR QUE DOIS REPOSITORIOS. Este aqui e PRIVADO e vai continuar privado. O
# GitHub Pages a partir de repositorio privado exige plano pago, entao o site
# mora num repositorio publico separado que contem APENAS O SITE CONSTRUIDO --
# nunca o codigo, nunca as specs, nunca o `docs/` cru.
#
# A fronteira nao e so de hospedagem, e de CONTEUDO: o build usa
# `mkdocs-publico.yml`, que exclui as specs, o handoff e o roteiro de deploy, e
# desliga o `show_source` do mkdocstrings. Sem esse recorte, publicar o site
# seria publicar o repositorio por outra porta -- o `show_source` embute o
# corpo das funcoes dentro do HTML. Ha teste amarrando isso
# (`tests/test_documentacao.py`).
#
# O BUILD ACONTECE AQUI, e nao no repositorio publico, e isso e o que faz o
# arranjo funcionar: o `mkdocstrings` precisa do codigo-fonte Python para ler
# as docstrings, e o codigo so existe deste lado. O publico recebe HTML pronto.
name: docs

on:
  push:
    branches: [main]
  # Manual tambem: permite conferir o site antes de mesclar uma branch grande.
  workflow_dispatch:

# Sem `pages: write` nem `id-token`: este repositorio NAO publica Pages. Ele so
# le a si mesmo e empurra para o outro, com a chave de deploy.
permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O PDF usa WeasyPrint, que depende das bibliotecas NATIVAS do GTK. Sem
      # este passo o build falha no IMPORT do plugin, nao na geracao -- e por
      # isso o `mkdocs.yml` do dia a dia nao o carrega: no Windows essas libs
      # nao existem e a previa local morreria.
      - name: Bibliotecas nativas do WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # SO o extra `docs`. Instalar o projeto inteiro traria torch (~500 MB)
      # para um job que nao roda modelo nenhum -- o `mkdocstrings` le o codigo
      # como TEXTO, nao o importa.
      - name: Dependencias da documentacao
        run: uv sync --extra docs --no-install-project

      # Traz para dentro de docs/ o Markdown e a marca que moram fora.
      - name: Reunir a documentacao externa
        run: uv run python scripts/reunir_docs.py

      # O SITE sai daqui, com `--strict`: link quebrado derruba o build em vez
      # de virar um 404 numa pagina publica.
      - name: Construir o site publico
        env:
          FRAUS_URL_DASHBOARD: ${{ vars.FRAUS_URL_DASHBOARD }}
        run: uv run mkdocs build --strict --config-file mkdocs-publico.yml

      # O PDF sai de um SEGUNDO build, e SEM `--strict`. Os dois detalhes sao
      # deliberados e custaram uma sessao para entender.
      #
      # POR QUE UM SEGUNDO BUILD. `mkdocs-pdf.yml` herda do publico, entao o
      # recorte e o mesmo -- mas construir os dois de uma vez significa que o
      # HTML publicado e o HTML renderizado para PDF sao o mesmo artefato, e
      # eles nao querem as mesmas coisas. Separado, cada um fica com o que
      # precisa sem negociar com o outro.
      #
      # POR QUE SEM `--strict`. O `mkdocs-to-pdf` usa a flag `strict` do MkDocs
      # para um fim diferente do site: ele CONTA os registros de nivel ERROR do
      # WeasyPrint e derruba o build com a soma. E o WeasyPrint emite um erro
      # por cada ancora de numero de linha do Material (`anchor_linenums`) --
      # foram 76 -- porque essas ancoras existem no HTML mas sao desenhadas por
      # CSS, e ele so registra ancora de elemento que gera caixa. Nenhuma delas
      # e defeito: "va para a linha 3 deste bloco" nao quer dizer nada dentro
      # de um PDF de 14 artigos.
      #
      # Nada de guarda se perde nisso: a confererencia de link entre paginas ja
      # rodou no passo acima, com `--strict`, sobre o mesmo conteudo. Este passo
      # e renderizacao, nao validacao.
      - name: Construir o PDF
        env:
          FRAUS_URL_DASHBOARD: ${{ vars.FRAUS_URL_DASHBOARD }}
        run: |
          uv run mkdocs build --config-file mkdocs-pdf.yml -d site-pdf
          mkdir -p site/pdf
          cp site-pdf/pdf/fraus.pdf site/pdf/fraus.pdf
          ls -l site/pdf/fraus.pdf

      # A ULTIMA TRAVA, e ela existe porque as anteriores sao configuracao e
      # esta e o artefato. Se qualquer coisa escapar do recorte, o job morre
      # ANTES de empurrar -- despublicar do GitHub e mais dificil que nao
      # publicar, e o Google ja pode ter indexado.
      - name: Conferir o que foi construido antes de publicar
        run: |
          set -e
          vazou=0
          if grep -rq "Source code in" site/ ; then
            echo "::error::o site construido embute codigo-fonte (show_source)"
            vazou=1
          fi
          for proibido in superpowers notas handoff hospedagem colab deploy-vercel cloud-run ; do
            if [ -e "site/$proibido" ] ; then
              echo "::error::'$proibido' entrou no site publico"
              vazou=1
            fi
          done
          test "$vazou" -eq 0
          # O PDF vem de um build separado e e COPIADO para dentro de site/. Um
          # erro nessa copia nao derrubaria nada por si -- publicaria um site
          # cuja home promete um anexo que nao esta la. A home o referencia em
          # HTML cru, que o `--strict` nao valida, entao a confererencia e aqui.
          if [ ! -s site/pdf/fraus.pdf ] ; then
            echo "::error::o PDF nao chegou em site/pdf/fraus.pdf"
            exit 1
          fi
          echo "recorte conferido: $(find site -name '*.html' | wc -l) paginas"

      - name: Publicar no repositorio publico
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Chave de deploy com ESCRITA no repositorio publico, guardada como
          # segredo AQUI. Um `GITHUB_TOKEN` nao serve: ele so tem poder no
          # repositorio em que o workflow roda.
          #
          # Como criar, uma vez:
          #   ssh-keygen -t ed25519 -C "fraus-docs" -f chave -N ""
          #   publico:  Settings > Deploy keys > Add  (chave.pub, MARQUE "Allow write access")
          #   privado:  Settings > Secrets > Actions > New  (chave, nome DEPLOY_KEY_DOCS)
          deploy_key: ${{ secrets.DEPLOY_KEY_DOCS }}
          external_repository: ${{ vars.REPO_DOCS }}
          publish_branch: gh-pages
          publish_dir: ./site
          # O repositorio publico e um ESPELHO do build, nao um historico de
          # edicoes: cada publicacao substitui a anterior por completo. Sem
          # isso, um arquivo que sai do recorte hoje continuaria servido
          # amanha, porque ninguem o apagou.
          force_orphan: true
          commit_message: "docs: site publicado a partir do repositorio privado"
