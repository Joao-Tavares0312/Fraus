name: api-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-producao
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependências travadas
        run: uv sync --frozen --extra dev --python 3.11
      - name: Testar contratos de deploy
        run: uv run pytest -q tests/test_deploy_vercel.py tests/test_operacao_deploy.py tests/test_pool_postgres.py

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment: production-api
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Obter configuração de produção
        run: npm exec --yes vercel@60.1.3 -- pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build reproduzível
        run: npm exec --yes vercel@60.1.3 -- build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Publicar build validado
        shell: bash
        run: |
          url="$(npm exec --yes vercel@60.1.3 -- deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "::add-mask::$url"
          test -n "$url"
      - name: Smoke pós-deploy
        env:
          FRAUS_SMOKE_URL: ${{ secrets.FRAUS_API_PUBLIC_URL }}
          FRAUS_SMOKE_TOKEN: ${{ secrets.FRAUS_CHAVE_ACESSO }}
        run: python scripts/smoke_deploy.py
