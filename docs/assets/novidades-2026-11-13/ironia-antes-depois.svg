<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="F1-macro e erro de calibração da cabeça de ironia, produção anterior e nova" font-family="system-ui,sans-serif">
<rect width="560" height="300" fill="#ffffff"/>
