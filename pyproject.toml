[project]
name = "fraus"
version = "0.1.0"
description = "Analise de satisfacao em atendimentos por chatbot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "emoji>=2.12",
    "transformers>=4.44",
    # Pinado: o fusor.joblib foi serializado com a 1.6.1, e joblib nao garante
    # compatibilidade entre versoes do sklearn. O Dockerfile ja fixava; a venv
    # local precisava fixar tambem para o trabalho ser reprodutivel.
    "scikit-learn==1.6.1",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    # JWT da autenticacao de usuario (spec 2026-08-31). Assinar e conferir a
    # mao com hmac+base64 custaria o mesmo e reintroduziria a classe de bug
    # que a biblioteca ja matou (confusao de algoritmo, exp nao conferido).
    "pyjwt>=2.8",
    # Postgres (Supabase). O `pool` nao e luxo: `Banco` abre conexao POR
    # chamada, e sem pool cada uma pagaria um handshake TLS pela rede -- o que
    # e barato num arquivo local e caro num banco remoto.
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Gerador do site de documentacao. Extra SEPARADO pelo mesmo motivo que o
# `dev` e opt-in: quem so quer subir a API nao baixa um gerador de site.
# `uv sync --extra docs` para trabalhar na documentacao.
#
# `mkdocstrings` e a razao de a escolha ser MkDocs e nao uma ferramenta do
# mundo JS: as docstrings deste projeto explicam POR QUE o codigo e assim, e
# nenhum gerador em Next/Astro le docstring de Python -- teria que reescrever
# tudo a mao em MDX, que e a receita para a documentacao divergir do codigo no
# dia seguinte. `mkdocs-to-pdf` cospe o PDF do site inteiro no mesmo
# `mkdocs build`, que e o formato de um anexo de monografia.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0",
    "mkdocs-to-pdf>=0.9",
]

# EXECUTOR torch (FRAUS_BACKEND=torch, o padrao). Saiu das dependencias
# principais em 15/09/2026: com FRAUS_BACKEND=onnx a API pontua sem ele, e
# deixa-lo obrigatorio faria toda instalacao carregar 497 MB que o backend
# onnx nunca importa. Os notebooks de treino e a conversao continuam exigindo.
torch = ["torch>=2.3"]

# RUNTIME do backend ONNX -- so o `onnxruntime`, que basta para PONTUAR.
# Ele nao traz torch: a inferencia acontece no grafo exportado, e o tokenizador
# do `transformers` funciona sem torch instalado. E o que permite uma imagem de
# deploy sem os 497 MB do torch.
onnx = ["onnxruntime>=1.20"]

# FERRAMENTA DE CONVERSAO, nunca de deploy. `optimum` exporta o checkpoint para
# ONNX e o `onnxruntime.quantization` o quantiza -- os dois rodam UMA vez, na
# maquina de quem converte, e nao tem nada que fazer num container de producao.
conversao = ["optimum[onnxruntime]>=1.24", "onnxruntime>=1.20", "torch>=2.3", "onnx-ir>=1.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `lento` sai da rodada padrao: sao testes de minutos, nao de segundos. Eles
# continuam existindo e sao obrigatorios ao mexer no gerador de corpus --
# `uv run pytest -m lento`. Desmarcar por padrao e diferente de apagar.
addopts = "-m 'not lento'"
markers = [
    "lento: leva minutos (esgota espaco de combinacoes). Rode com -m lento.",
]
