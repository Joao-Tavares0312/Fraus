[project]
name = "dolos"
version = "0.1.0"
description = "Analise de satisfacao em atendimentos por chatbot"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "emoji>=2.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
