[project]
name = "fraus"
version = "0.1.0"
description = "Analise de satisfacao em atendimentos por chatbot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "emoji>=2.12",
    "transformers>=4.44",
    "torch>=2.3",
    # Pinado: o fusor.joblib foi serializado com a 1.6.1, e joblib nao garante
    # compatibilidade entre versoes do sklearn. O Dockerfile ja fixava; a venv
    # local precisava fixar tambem para o trabalho ser reprodutivel.
    "scikit-learn==1.6.1",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `lento` sai da rodada padrao: sao testes de minutos, nao de segundos. Eles
# continuam existindo e sao obrigatorios ao mexer no gerador de corpus --
# `uv run pytest -m lento`. Desmarcar por padrao e diferente de apagar.
addopts = "-m 'not lento'"
markers = [
    "lento: leva minutos (esgota espaco de combinacoes). Rode com -m lento.",
]
