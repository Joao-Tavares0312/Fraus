[project]
name = "fraus"
version = "0.1.0"
description = "Analise de satisfacao em atendimentos por chatbot"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "emoji>=2.12", "transformers>=4.44", "torch>=2.3", "scikit-learn>=1.5", "joblib>=1.4", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
