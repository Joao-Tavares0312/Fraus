# O MESMO site, mais o PDF. Roda no CI (Linux); nao roda no Windows.
#
# POR QUE DOIS ARQUIVOS EM VEZ DE UM. O `mkdocs-to-pdf` usa WeasyPrint, que
# depende das bibliotecas nativas do GTK (`gobject-2.0`, `pango`, `cairo`). No
# Ubuntu do runner elas vem de um `apt install`; no Windows do dia a dia elas
# simplesmente nao existem, e o plugin falha no IMPORT -- antes de qualquer
# opcao de configuracao ser lida, entao nao ha `enabled_if_env` que salve.
#
# Com o plugin dentro do `mkdocs.yml` principal, `uv run mkdocs serve` na
# maquina de quem escreve a documentacao morreria com um OSError sobre
# `gobject-2.0-0` -- um erro que nao tem nada a ver com o que a pessoa estava
# fazendo. A previa local precisa funcionar em qualquer maquina; o PDF e
# artefato de publicacao.
#
# `INHERIT` e do proprio MkDocs: este arquivo NAO e uma copia da configuracao,
# e um delta sobre ela. Tema, nav e mkdocstrings continuam com uma fonte so.
#
# E ele herda do PUBLICO, nao do principal, desde 11/09/2026. O PDF e o anexo
# da monografia -- um documento que circula em banca, vai para biblioteca e sai
# do controle de quem escreveu. Herdar do config interno faria o anexo carregar
# o codigo-fonte, as 38 specs e a secao "a porta destrancada" para dentro de um
# PDF, que e o formato mais dificil de despublicar que existe.
INHERIT: mkdocs-publico.yml

# A LISTA DE PLUGINS PRECISA SER REESCRITA INTEIRA, e isso e uma armadilha
# real, nao burocracia de YAML: `plugins` e uma LISTA, e o MkDocs SUBSTITUI a
# lista herdada em vez de somar. Declarar so o `to-pdf` aqui apagaria a busca e
# o mkdocstrings do build.
#
# A consequencia perigosa e a outra ponta: como a lista e reescrita, ela
# reescreve TAMBEM o `show_source: false` que o config publico definiu. Este
# arquivo ja esteve com `true` herdado da versao anterior -- e o PDF teria
# levado o codigo-fonte inteiro para dentro do anexo da monografia, sem nada no
# build reclamando.
#
# Regra, entao: qualquer opcao de seguranca do `mkdocs-publico.yml` precisa ser
# REPETIDA aqui, e ha teste amarrando as duas (`tests/test_documentacao.py`).
plugins:
  - search:
      lang: pt
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            # Espelha o config publico. Ver o bloco acima antes de mexer.
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
  # UM PDF do site inteiro no MESMO build que publica as paginas -- e o formato
  # de um anexo de monografia, sem passo manual e sem versao que envelhece
  # separada do site.
  - to-pdf:
      output_path: pdf/fraus.pdf
      cover_title: Fraus
      cover_subtitle: Medição de satisfação sem LLM em runtime
      author: João Pedro Tavares Vicente
      toc_level: 3
